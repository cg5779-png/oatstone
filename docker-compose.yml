services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oatstone}
      POSTGRES_USER: ${POSTGRES_USER:-oatstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oatstone} -d ${POSTGRES_DB:-oatstone}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/cg5779-png/oatstone:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-oatstone}
      POSTGRES_USER: ${POSTGRES_USER:-oatstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-smtp.naver.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INQUIRY_RECIPIENT: ${INQUIRY_RECIPIENT:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-oat4243}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
    volumes:
      - uploads:/app/backend/uploads

volumes:
  pgdata:
  uploads:
